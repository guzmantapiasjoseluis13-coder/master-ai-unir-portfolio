version: '3.8'

services:
  backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    networks:
      - ai-network

  streamlit_frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run pages/1_Vision_Fenix_SENA.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend_api:8000
    depends_on:
      - backend_api
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge