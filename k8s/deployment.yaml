apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform-deployment
  labels:
    app: enterprise-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-ai
  template:
    metadata:
      labels:
        app: enterprise-ai
    spec:
      containers:
      - name: tutor-app
        image: guzmantapiasjoseluis13/master-ai-unir-portfolio:latest
        ports:
        - containerPort: 8501
        resources:
          limits:
          - cpu: "500m"
            memory: "512Mi"
          requests:
          - cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-platform-service
spec:
  type: LoadBalancer
  selector:
    app: enterprise-ai
  ports:
    - protocol: TCP
    port: 80
    targetPort: 8501