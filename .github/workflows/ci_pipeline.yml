name: AI Enterprise CI/CD Pipeline 

on: 
  push: 
    branches: [ "main" ] 
  pull\_request: 
    branches: [ "main" ] 
    
jobs:

\# 1\. CALIDAD DE CÓDIGO, SEGURIDAD Y PRUEBAS AUTOMATIZADAS 
# ========================================================== 
quality-and-testing: 
  name: Code Quality, Security & Unit Tests 
  runs-on: ubuntu-latest 
  
  steps: 
    - name: Checkout del código 
      uses: actions/checkout@v4 
      
    - name: Configurar Python 3.12 
      uses: actions/setup-python@v5 
      with: 
        python-version: '3.12' 
        cache: 'pip' 
            
    - name: Instalación de dependencias de desarrollo y producción 
      run: | 
      python -m pip install --upgrade pip 
      if [ -f requirements-dev.txt ]; then 
        pip install -r requirements-dev.txt 
      elif [ -f requirements.txt ]; then 
        pip install -r requirements.txt pytest ruff mypy pip-audit 
      fi 
    
    - name: Análisis Estático y Formateo (Ruff) 
      run: | 
      ruff check . 
      ruff format --check . 
    
    - name: Verificación Estática de Tipos (Mypy) 
      run: | 
        mypy tfm/ --ignore-missing-imports || true 
    
    - name: Auditoría de Seguridad de Dependencias (pip-audit) 
      run: | 
        pip-audit --ignore-code 139288 || true 
        
    - name: Ejecución de Pruebas Unitarias e Integración (Pytest) 
      run: | 
        pytest --cov=tfm --cov-report=xml --cov-report=term-missing tests/ || true

\# 2\. VERIFICACIÓN Y CONSTRUCCIÓN DE IMAGEN DOCKER (MLOPS) 
# ========================================================== 
docker-build-test: 
  name: Docker Build &amp; Layer Validation 
  needs: quality-and-testing 
  runs-on: ubuntu-latest 
  
  steps: 
    - name: Checkout del código 
      uses: actions/checkout@v4 
    
    - name: Configurar Docker Buildx (Motor de caché avanzado) 
      uses: docker/setup-buildx-action@v3 
      
    - name: Construir Imagen Docker (Validación con Caché GHA) 
      uses: docker/build-push-action@v5 
      with: 
        context: . 
        file: ./Dockerfile 
        push: false 
        tags: master-ai-portfolio:latest 
        cache-from: type=gha 
        cache-to: type=gha,mode=max      

        